# Copy this file to .github/workflows/lifeboat.yml in the app repository.
# A published customer workflow pins lastgoodapp/lifeboat@<40-character commit> # v1.
# This copy runs the action beside it, for a local check.
name: Lifeboat

on:
  push:
    # Merging a change to this file runs the backup. A successful backup on that push runs the restore test.
    branches:
      - "main"
    paths:
      - .github/workflows/lifeboat.yml
  schedule:
    # 16:17 UTC is 02:17 in Australian Eastern Standard Time, or 03:17 during daylight saving.
    - cron: "17 16 * * *"
    # First day of the month, an hour later, restores the newest dump.
    - cron: "17 17 1 * *"
  workflow_dispatch:
    inputs:
      mode:
        description: backup or restore-test
        required: true
        default: backup
        type: choice
        options:
          - backup
          - restore-test

permissions:
  contents: read        # your code, every branch and tag
  issues: read          # issues and their comments, for the GitHub metadata copy
  pull-requests: read   # pull requests and their comments, for the same copy

jobs:
  backup:
    if: github.event_name == 'push' || github.event_name == 'schedule' && github.event.schedule == '17 16 * * *' || github.event.inputs.mode == 'backup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./lifeboat
        with:
          mode: backup
          postgres-major: "17"
          project: ${{ vars.LIFEBOAT_PROJECT }}
          database-url: ${{ secrets.DATABASE_URL }}
          s3-bucket: ${{ vars.LIFEBOAT_BUCKET }}
          s3-access-key-id: ${{ secrets.LIFEBOAT_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.LIFEBOAT_SECRET_ACCESS_KEY }}
          s3-endpoint: ${{ vars.LIFEBOAT_S3_ENDPOINT }}
          s3-region: ${{ vars.LIFEBOAT_S3_REGION }}
          s3-prefix: ${{ vars.LIFEBOAT_PREFIX }}
          public-key: ${{ vars.LIFEBOAT_PUBLIC_KEY }}
          private-key: ${{ secrets.LIFEBOAT_PRIVATE_KEY }}
          encryption-passphrase: ${{ secrets.LIFEBOAT_ENCRYPTION_PASSPHRASE }}
          manage-retention: ${{ vars.LIFEBOAT_MANAGE_RETENTION }}
          monthly-copies: ${{ vars.LIFEBOAT_MONTHLY_COPIES }}
          storage-login: ${{ secrets.LIFEBOAT_STORAGE_LOGIN }}
          supabase-publishable-key: ${{ vars.LIFEBOAT_SUPABASE_PUBLISHABLE_KEY }}
          storage-s3-endpoint: ${{ vars.SUPABASE_STORAGE_S3_ENDPOINT }}
          storage-s3-region: ${{ vars.SUPABASE_STORAGE_S3_REGION }}
          storage-s3-access-key-id: ${{ secrets.SUPABASE_STORAGE_S3_ACCESS_KEY_ID }}
          storage-s3-secret-access-key: ${{ secrets.SUPABASE_STORAGE_S3_SECRET_ACCESS_KEY }}
          supabase-token: ${{ secrets.LIFEBOAT_SUPABASE_TOKEN }}
          vercel-token: ${{ secrets.LIFEBOAT_VERCEL_TOKEN }}
          vercel-project-id: ${{ vars.LIFEBOAT_VERCEL_PROJECT_ID }}
          vercel-team-id: ${{ vars.LIFEBOAT_VERCEL_TEAM_ID }}
          checkin-secret: ${{ secrets.LIFEBOAT_CHECKIN_SECRET }}

  restore-test:
    needs: backup
    # Strict mode keeps no private key in this repository, so there is nothing here to open a copy with. The connect
    # wizard sets LIFEBOAT_STRICT to true for it, and to false with a key whose private half is here.
    if: always() && vars.LIFEBOAT_STRICT != 'true' && (github.event_name == 'push' && needs.backup.result == 'success' || github.event_name == 'schedule' && github.event.schedule == '17 17 1 * *' || github.event.inputs.mode == 'restore-test')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Start the restore database
        run: |
          set -eu
          url_file="${RUNNER_TEMP}/lifeboat-restore-url"
          rm -f "$url_file"
          free_kb="$(df -Pk / | awk 'NR==2 {print $4}')"
          echo "Disk free before the restore image: ${free_kb} KiB."
          mode="supabase"
          image=""
          # The same image, pinned to its digest, from each registry in turn.
          supabase_images="ghcr.io/supabase/postgres:17.6.1.136@sha256:f371b5f3f2ac0a05703f33d6e6134515fb2498cab708fb948a0aeb7481467c00
            public.ecr.aws/supabase/postgres:17.6.1.136@sha256:f371b5f3f2ac0a05703f33d6e6134515fb2498cab708fb948a0aeb7481467c00
            docker.io/supabase/postgres:17.6.1.136@sha256:f371b5f3f2ac0a05703f33d6e6134515fb2498cab708fb948a0aeb7481467c00"
          if [ "$free_kb" -lt 10485760 ]; then
            echo "Not enough free disk for the Supabase image. Using postgres:17."
            mode="stock"
            image="postgres:17"
          fi
          start_db() {
            docker rm -f lifeboat-restore >/dev/null 2>&1 || true
            if [ "$1" = "supabase" ]; then
              docker run -d --name lifeboat-restore \
                -e POSTGRES_PASSWORD=throwaway \
                -p 5432:5432 \
                "$2"
            else
              docker run -d --name lifeboat-restore \
                -e POSTGRES_PASSWORD=throwaway \
                -e POSTGRES_DB=restore \
                -p 5432:5432 \
                "$2"
            fi
          }
          wait_db() {
            local user="$1"
            local i
            local tries="${LIFEBOAT_RESTORE_WAIT_TRIES:-60}"
            local pause="${LIFEBOAT_RESTORE_WAIT_SECONDS:-5}"
            for i in $(seq 1 "$tries"); do
              if docker exec lifeboat-restore pg_isready -U "$user" >/dev/null 2>&1; then
                return 0
              fi
              sleep "$pause"
            done
            return 1
          }
          pull_supabase() {
            local candidate
            for candidate in $supabase_images; do
              if docker pull --quiet "$candidate" >/dev/null; then
                image="$candidate"
                echo "Supabase image pulled from ${candidate%%/*}."
                return 0
              fi
              echo "${candidate%%/*} did not give the Supabase image."
            done
            echo "The Supabase image could not be pulled. Using postgres:17."
            return 1
          }
          if [ "$mode" = "supabase" ]; then
            if ! pull_supabase; then
              mode="stock"
              image="postgres:17"
              start_db stock "$image"
              wait_db postgres
            elif ! start_db supabase "$image" || ! wait_db supabase_admin; then
              echo "The Supabase image did not start. Using postgres:17."
              mode="stock"
              image="postgres:17"
              start_db stock "$image"
              wait_db postgres
            fi
          else
            start_db stock "$image"
            wait_db postgres
          fi
          echo "Disk free with the restore image running: $(df -Pk / | awk 'NR==2 {print $4}') KiB (${mode} image)."
          if [ "$mode" = "supabase" ]; then
            printf '%s' 'postgresql://supabase_admin:throwaway@localhost:5432/postgres' > "$url_file"
          else
            printf '%s' 'postgresql://postgres:throwaway@localhost:5432/restore' > "$url_file"
            # postgres:17 has no PostGIS. When the dump uses it, Lifeboat replaces this container with the PostGIS image.
            echo "LIFEBOAT_RESTORE_CONTAINER=lifeboat-restore" >> "$GITHUB_ENV"
            echo "LIFEBOAT_RESTORE_POSTGIS_IMAGE=postgis/postgis:17-3.5" >> "$GITHUB_ENV"
          fi
      - uses: ./lifeboat
        with:
          mode: restore-test
          postgres-major: "17"
          project: ${{ vars.LIFEBOAT_PROJECT }}
          restore-database-url: postgresql://postgres:throwaway@localhost:5432/restore
          s3-bucket: ${{ vars.LIFEBOAT_BUCKET }}
          s3-access-key-id: ${{ secrets.LIFEBOAT_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.LIFEBOAT_SECRET_ACCESS_KEY }}
          s3-endpoint: ${{ vars.LIFEBOAT_S3_ENDPOINT }}
          s3-region: ${{ vars.LIFEBOAT_S3_REGION }}
          s3-prefix: ${{ vars.LIFEBOAT_PREFIX }}
          public-key: ${{ vars.LIFEBOAT_PUBLIC_KEY }}
          private-key: ${{ secrets.LIFEBOAT_PRIVATE_KEY }}
          encryption-passphrase: ${{ secrets.LIFEBOAT_ENCRYPTION_PASSPHRASE }}
          manage-retention: ${{ vars.LIFEBOAT_MANAGE_RETENTION }}
          checkin-secret: ${{ secrets.LIFEBOAT_CHECKIN_SECRET }}
